description: >-
  www.perenti.com is a WordPress site. Its OAuth protected-resource metadata
  (/.well-known/oauth-protected-resource, HTTP 200 JSON) advertises the resource
  https://www.perenti.com/wp-json/mcp/mcp-oauth-server with authorization server
  https://www.perenti.com, bearer header auth and scope "mcp". The public WordPress
  REST index (/wp-json/, HTTP 200) lists an `mcp` namespace with routes
  /mcp/mcp-oauth-server and /mcp/mcp-adapter-default-server (methods POST, GET, DELETE),
  plus a `wp-abilities/v1` namespace, which is the shape of the WordPress MCP Adapter
  plugin. Both MCP routes answer an unauthenticated GET with HTTP 401. Perenti publishes
  no documentation for this server and no tool list; no tools/list was attempted
  because the endpoint requires authentication. This appears to be a site-plugin
  surface rather than a documented developer product.
