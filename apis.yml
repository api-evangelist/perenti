name: Perenti

description: 'Perenti (ASX-listed, www.perenti.com) describes itself as a leading global diversified mining services
  group with interests in contract mining, drilling services, mining services and technology solutions. From origins
  in Kalgoorlie in the 1980s it has grown into one of the largest mining services companies in the world, offering
  surface and underground hard-rock mining, drilling, equipment supply and procurement, and mining technology (including
  the idoba software business, e.g. idoba.sim and idoba.predict) with a workforce of about 10,000 across four continents.
  No public developer portal, API documentation or API contract was found on its site. Surfaced via the API Evangelist
  harvest backlog (source: australia-apidays-2026).'

